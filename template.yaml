AWSTemplateFormatVersion: 2010-09-09
Description: >-
  taskhub-restapi-backend-repo
Transform:
  - AWS::Serverless-2016-10-31
# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    LoggingConfig:
      LogFormat: JSON

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  TaskHubApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Dev
      Name: TaskHub

  TaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TaskHandler
      Handler: TaskHandler.TasksLambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      CodeUri: ./src/handlers/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: task
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/task"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/task/index/*"
      Events:
        GetTasksByUserId:
          Type: Api
          Properties:
            RestApiId: !Ref TaskHubApiGatewayApi
            Path: /tasks/{UserId} # this api will list all the tasks created by the perticular user
            Method: GET
